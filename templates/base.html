<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}SHAMBA Tracker{% endblock %} · Acre Insights</title>
<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/favicon.ico') }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', filename='img/favicon-32.png') }}">
<link rel="icon" type="image/png" sizes="256x256" href="{{ url_for('static', filename='img/favicon-256.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='img/apple-touch-icon.png') }}">
<meta name="theme-color" content="#030920">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: '#030920', dove: '#6C6C6C', silver: '#D6DBD5',
          sage: '#B0D48C', sagedeep: '#7FB65E', sagesoft: '#E7F1DB',
          canvas: '#F2F5EF',
        },
        fontFamily: { sans: ['Montserrat', 'system-ui', 'sans-serif'], mono: ['Montserrat', 'system-ui', 'sans-serif'] },
        borderRadius: { xl2: '1.1rem' },
      }
    }
  }
</script>
<style>
  html{ -webkit-text-size-adjust:100%; }
  body{ font-family:'Montserrat',system-ui,sans-serif; letter-spacing:-0.006em; -webkit-font-smoothing:antialiased; }
  .glass{ background:rgba(255,255,255,0.66); backdrop-filter:saturate(140%) blur(14px); -webkit-backdrop-filter:saturate(140%) blur(14px); border:1px solid rgba(3,9,32,0.08); }
  .glass-solid{ background:#fff; border:1px solid #D6DBD5; }
  .tnum{ font-variant-numeric:tabular-nums; }
  /* Instrument type: one family throughout, so readings are set apart by
     tabular figures and tracking rather than by a second typeface. Montserrat
     carries tnum, which keeps a column of numbers aligned and makes 1 occupy
     the same width as 8. */
  .inst{ font-variant-numeric:tabular-nums; font-feature-settings:'tnum' 1; font-weight:600; }
  .eyebrow{ font-size:10px; font-weight:700; letter-spacing:.17em; text-transform:uppercase; }
  /* Scroll reveal as pure enhancement: content is visible by default, and only
     starts hidden once the script has confirmed it can reveal it again. */
  body.js-motion .reveal{ opacity:0; transform:translateY(18px); transition:opacity .7s cubic-bezier(.2,.7,.3,1), transform .7s cubic-bezier(.2,.7,.3,1); }
  body.js-motion .reveal.in{ opacity:1; transform:none; }
  @media (prefers-reduced-motion: reduce){
    body.js-motion .reveal{ opacity:1 !important; transform:none !important; transition:none !important; }
    *{ animation-duration:.001ms !important; transition-duration:.001ms !important; }
  }
  a:focus-visible, button:focus-visible, [tabindex]:focus-visible, summary:focus-visible{
    outline:2px solid #7FB65E; outline-offset:2px; border-radius:6px;
  }
  .field{ transition:.15s; }
  .field:focus{ outline:none; border-color:#B0D48C; box-shadow:0 0 0 3px rgba(176,212,140,.35); }
  /* editable cells in the review table */
  .cell{ transition:.15s; border:1px solid transparent; border-radius:8px; }
  .cell:hover{ background:rgba(3,9,32,.03); }
  .cell:focus{ outline:none; background:#fff; border-color:#B0D48C; box-shadow:0 0 0 3px rgba(176,212,140,.35); }
  .flash-enter{ animation:flashIn .3s ease both; }
  @keyframes flashIn{ from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none} }
  /* dialogs never overflow small screens */
  dialog{ max-width:calc(100vw - 1.5rem); }
  ::-webkit-scrollbar{ height:10px; width:10px; }
  ::-webkit-scrollbar-thumb{ background:#D6DBD5; border-radius:99px; }
  @media print{ .no-print{ display:none !important; } body{ background:#fff; } }
</style>
{% block head %}{% endblock %}
</head>
<body class="bg-canvas text-ink min-h-screen">

{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
<div class="fixed top-3 right-3 left-3 sm:left-auto z-50 space-y-2 no-print flex flex-col items-stretch sm:items-end" id="flashwrap">
  {% for cat, msg in messages %}
  <div class="flash-enter glass rounded-xl2 pl-4 pr-2.5 py-3 w-full sm:max-w-sm shadow-lg flex items-start gap-3
              {{ 'border-sagedeep/40' if cat=='ok' else 'border-ink/10' }}"
       data-cat="{{ cat }}">
    <span class="mt-0.5 shrink-0 {{ 'text-sagedeep' if cat=='ok' else 'text-ink' }}">
      {% if cat=='ok' %}
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9.2"/><path d="M8 12.3 11 15.3 16.3 9.2"/></svg>
      {% else %}
      <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5M12 16h.01"/></svg>
      {% endif %}
    </span>
    <p class="text-[13px] font-medium leading-snug flex-1 min-w-0 break-words pt-0.5">{{ msg }}</p>
    <button type="button" onclick="this.closest('[data-cat]').remove()" aria-label="Dismiss"
            class="shrink-0 -mt-0.5 w-7 h-7 grid place-items-center rounded-lg text-dove hover:text-ink hover:bg-ink/5 transition">
      <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  {% endfor %}
</div>
<script>
  // Success messages fade on their own; warnings/errors stay until dismissed.
  document.querySelectorAll('#flashwrap [data-cat="ok"]').forEach(function(el){
    setTimeout(function(){ el.style.transition='opacity .5s'; el.style.opacity='0'; setTimeout(function(){ el.remove(); }, 500); }, 5000);
  });
       // Disable right-click and keyboard shortcuts
document.addEventListener('contextmenu', event => event.preventDefault());
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S')) {
        e.preventDefault();
    }
});
</script>
{% endif %}
{% endwith %}

{% block body %}{% endblock %}
</body>
</html>
